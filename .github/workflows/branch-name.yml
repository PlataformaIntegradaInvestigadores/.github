name: Validar nombre de rama

on:
  workflow_call:

jobs:
  branch-name:
    name: Validar nombre de rama
    runs-on: ubuntu-latest
    steps:
      - name: Verificar prefijo + destino (feature/*, chore/* -> develop; hotfix/*, develop -> main)
        env:
          BRANCH: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          case "$TARGET" in
            develop)
              case "$BRANCH" in
                feature/*|chore/*) echo "OK: $BRANCH -> $TARGET"; exit 0 ;;
                *) echo "Rama '$BRANCH' invalida para destino develop (usar feature/* o chore/*)"; exit 1 ;;
              esac
              ;;
            main)
              case "$BRANCH" in
                develop|hotfix/*) echo "OK: $BRANCH -> $TARGET"; exit 0 ;;
                *) echo "Rama '$BRANCH' invalida para destino main (usar develop o hotfix/*)"; exit 1 ;;
              esac
              ;;
            *)
              echo "Destino desconocido: $TARGET"; exit 1 ;;
          esac
